<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: https://assets.local data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkLeaf Editor</title>
  </head>
  <body>
    <div id="app">
      <form id="find-bar" class="find-bar" hidden>
        <div class="find-fields">
          <input id="find-input" type="text" aria-label="查找内容" placeholder="查找" autocomplete="off" />
          <input id="replace-input" type="text" aria-label="替换内容" placeholder="替换为" autocomplete="off" hidden />
          <label><input id="find-case" type="checkbox" /> 区分大小写</label>
          <label><input id="find-whole" type="checkbox" /> 全词</label>
          <span id="find-result" aria-live="polite">0/0</span>
        </div>
        <div class="find-actions">
          <button id="find-previous" type="button">上一个</button>
          <button id="find-next" type="button">下一个</button>
          <button id="replace-one" type="button" hidden>替换</button>
          <button id="replace-all" type="button" hidden>全部替换</button>
          <button id="find-close" type="button" aria-label="关闭查找栏">关闭</button>
        </div>
      </form>
      <div id="editor" aria-label="Markdown 可视化编辑区"></div>
      <div id="source-editor" aria-label="Markdown 源码编辑区" hidden></div>
      <button id="source-toggle" type="button" hidden>切换源码模式</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
