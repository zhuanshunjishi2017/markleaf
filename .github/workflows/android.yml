name: android

on:
  push:
    paths:
      - 'apps/android/**'
      - 'packages/editor-web/**'
      - 'packages/editor-core/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build editor web bundle
        run: |
          corepack pnpm --dir packages/editor-core install --frozen-lockfile
          corepack pnpm --dir packages/editor-web install --frozen-lockfile
          corepack pnpm --dir packages/editor-core build:renderer
          corepack pnpm --dir packages/editor-web build

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        working-directory: apps/android
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: markleaf-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
